name: Release server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-server
  cancel-in-progress: true

jobs:
  package:
    name: Package server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet run --project Content.Packaging server --platform win-x64 --hybrid-acz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/SS14.Server_win-x64.zip --title "Server build" --notes "$GITHUB_SHA" --target "$GITHUB_SHA"
