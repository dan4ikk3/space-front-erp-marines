name: Upstream RMC-14

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-rmc14
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with RMC-14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: spacefront-split
          fetch-depth: 0
      - name: Create update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BASE=$(cat .github/upstream-rmc14.sha)
          git remote add rmc https://github.com/RMC-14/RMC-14.git
          git fetch --no-tags --filter=blob:none rmc master
          NEW=$(git rev-parse rmc/master)
          [ "$BASE" = "$NEW" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="upstream-rmc14/${NEW:0:10}"
          git checkout -b "$BR"
          git diff --binary "$BASE" "$NEW" -- . \
            ':!RobustToolbox' ':!RSI.NET' ':!.gitmodules' ':!.github' ':!.vscode' \
            ':!Modifications' ':!README.md' ':!PATCHES.md' ':!ИЗМЕНЕНИЯ.md' \
            ':!LICENSE-SPACE-FRONT.txt' > /tmp/upstream.patch
          CONFLICT=0
          git apply --3way --whitespace=nowarn /tmp/upstream.patch || CONFLICT=1
          echo "$NEW" > .github/upstream-rmc14.sha
          git add -A
          git commit -m "Upstream RMC-14 ${NEW:0:10}"
          git push --force origin "$BR"
          ARGS=()
          [ "$CONFLICT" = 1 ] && ARGS+=(--draft)
          gh pr create --base spacefront-split --head "$BR" \
            --title "Upstream RMC-14 ${NEW:0:10}" \
            --body "RMC-14: ${BASE:0:10}..${NEW:0:10}. Конфликты: $CONFLICT. RobustToolbox и RSI.NET не затронуты." \
            "${ARGS[@]}" || true
